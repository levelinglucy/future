name: Spiral Garden smoke

on:
  pull_request:
    paths:
      - "build_spiral_garden.py"
      - "compare_spiral_gardens.py"
      - "trace_spiral_garden.py"
      - "seed_registry.json"
      - "anchor_registry.json"
      - "tests/test_spiral_garden.py"
      - "tests/test_spiral_garden_diff.py"
      - "tests/test_spiral_garden_trace.py"
      - "tests/test_spiral_garden_demo.py"
      - "examples/spiral_garden_demo.py"
      - "docs/SPIRAL_GARDEN.md"
      - ".github/workflows/spiral-garden.yml"
  push:
    branches: [main]
    paths:
      - "build_spiral_garden.py"
      - "compare_spiral_gardens.py"
      - "trace_spiral_garden.py"
      - "seed_registry.json"
      - "anchor_registry.json"
      - "tests/test_spiral_garden.py"
      - "tests/test_spiral_garden_diff.py"
      - "tests/test_spiral_garden_trace.py"
      - "tests/test_spiral_garden_demo.py"
      - "examples/spiral_garden_demo.py"
      - "docs/SPIRAL_GARDEN.md"
      - ".github/workflows/spiral-garden.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile builder
        run: python -m py_compile build_spiral_garden.py compare_spiral_gardens.py trace_spiral_garden.py examples/spiral_garden_demo.py
      - name: Test isolated graph construction
        run: python -m unittest discover -s tests -p 'test_spiral_garden*.py' -v
      - name: Run disposable graph walkthrough
        run: python examples/spiral_garden_demo.py
